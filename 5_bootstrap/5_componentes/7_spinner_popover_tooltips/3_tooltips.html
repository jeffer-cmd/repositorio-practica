<!doctype html>
<html lang="es">
    <head>
<!-- se pone el starter template que bootstrap trae por defecto y esta en starter template, ahorra poner el html -->
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">


        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.rtl.min.css" integrity="sha384-CfCrinSRH2IR6a4e6fy2q6ioOX7O6Mtm1L9vRvFZ1trBncWmMePhzvafv7oIcWiW" crossorigin="anonymous">

        <title>template</title>
    </head>
    <body>

    <div class="container">
<!-- 
    los tooltips son msj de ayuda, en bootstrap para poderlos habilitar hay que poner un script adicional abajo del script de bootstrap, si se pone arriba del de bootstrap no funciona -->

    <button type="button" class="btn btn-secondary"
        data-bs-toggle="tooltip" data-bs-placement="left"
        data-bs-custom-class="custom-tooltip"
        data-bs-title="momento xd.">
        Boton tooltip
</button>







    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <script>
        const tooltipTriggerList = document.querySelectorAll('[data-bs-toggle="tooltip"]')
        const tooltipList = [...tooltipTriggerList].map(tooltipTriggerEl => new bootstrap.Tooltip(tooltipTriggerEl))
    </script>


    </body>
</html>
