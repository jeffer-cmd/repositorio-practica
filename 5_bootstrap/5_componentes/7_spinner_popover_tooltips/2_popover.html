<!doctype html>
<html lang="es">
    <head>
<!-- se pone el starter template que bootstrap trae por defecto y esta en starter template, ahorra poner el html -->
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">


        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.rtl.min.css" integrity="sha384-CfCrinSRH2IR6a4e6fy2q6ioOX7O6Mtm1L9vRvFZ1trBncWmMePhzvafv7oIcWiW" crossorigin="anonymous">

        <title>template</title>
    </head>
    <body>

    <div class="container">
<!-- 
    los popovers o ventanas emergentes que son normalmente para tutoriales, en bootstrap para poderlos habilitar hay que poner un script adicional abajo del script de bootstrap, si se pone arriba del de bootstrap no funciona -->

    <button type="button" class="btn btn-lg btn-danger" data-bs-toggle="popover" data-bs-title="Popover title" data-bs-content="And here’s some amazing content. It’s very engaging. Right?">Click to toggle popover</button>

    <!-- y si quiero que el cuadro de la notificacion aparezca en un sentido lo busco en bootstrap en el apartado 4 direcciones -->

    <br>
    <br class="my-5">
    <button type="button" class="btn btn-secondary" data-bs-container="body" data-bs-toggle="popover" data-bs-placement="top" data-bs-content="Probando">
    Arriba</button> <!--debe tener el espacio suficiente para funcionar-->

    </div>








    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <script>
        const popoverTriggerList = document.querySelectorAll('[data-bs-toggle="popover"]')
        const popoverList = [...popoverTriggerList].map(popoverTriggerEl => new bootstrap.Popover(popoverTriggerEl))
    </script>


    </body>
</html>
